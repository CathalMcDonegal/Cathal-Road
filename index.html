<!doctype html>
<html lang="ca"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101b20"><meta name="description" content="Cathal Road — el teu centre de comandament per viatjar en moto.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/cathal-road-icon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Cathal Road</title>
<style>
:root{--bg:#101b20;--panel:#18262c;--panel2:#1e3037;--line:#2b4047;--ink:#f1f3ed;--muted:#9aaba9;--lime:#c7e36a;--orange:#e58a50;--red:#e47769;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px 'DM Sans',sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.app{max-width:1500px;margin:auto;padding:0 28px 60px}.top{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:#101b20ed;backdrop-filter:blur(16px);z-index:1000}.brand{display:flex;gap:12px;align-items:center}.brand img{width:42px;height:42px;border-radius:13px}.brand b{font:800 15px Manrope;letter-spacing:2px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-top:3px}.topright{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:12px}.status{width:8px;height:8px;border-radius:50%;background:var(--lime);display:inline-block;margin-right:7px}
main{padding-top:30px}.eyebrow{color:var(--lime);font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:8px 0 24px}.head h1{font:700 clamp(28px,4vw,43px)/1.08 Manrope;letter-spacing:-1.5px;margin:0}.head p{color:var(--muted);margin:9px 0 0;line-height:1.6}.btn{border:0;background:var(--lime);color:#18211b;border-radius:11px;padding:12px 16px;font-weight:800;font-size:12px}.btn.secondary{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.btn.danger{background:#492b2b;color:#ffd9d2}
.hero{border:1px solid #40504a;background:linear-gradient(115deg,#243b38,#17292e 70%);border-radius:24px;padding:30px;display:grid;grid-template-columns:1.25fr .75fr;gap:20px;overflow:hidden;position:relative}.hero:after{content:'RIDE';position:absolute;right:-18px;bottom:-57px;font:800 clamp(100px,18vw,230px) Manrope;color:#ffffff08;pointer-events:none}.hero h2{font:700 clamp(25px,3.5vw,39px)/1.12 Manrope;margin:12px 0;max-width:550px}.hero p{color:#c0ceca;line-height:1.7;max-width:470px}.hero-art{display:flex;align-items:center;justify-content:center;font-size:clamp(90px,15vw,170px);filter:drop-shadow(0 15px 20px #0005);transform:rotate(-12deg)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 30px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}.stat{padding:17px}.stat span{color:var(--muted);font-size:11px}.stat b{display:block;font:700 27px Manrope;margin:8px 0 2px}.stat small{color:var(--muted);font-size:10px}
.sectionbar{display:flex;align-items:center;justify-content:space-between;margin:28px 0 13px}.sectionbar h2{font:700 17px Manrope;margin:0}.sectionbar span{color:var(--muted);font-size:11px}.modules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.module{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:19px;text-align:left;color:var(--ink);min-height:135px;transition:.18s}.module:hover{transform:translateY(-3px);border-color:#8ca35b;background:var(--panel2)}.module .ico{width:42px;height:42px;border-radius:13px;background:#2c4038;color:var(--lime);display:grid;place-items:center;font-size:21px;margin-bottom:16px}.module b{font:700 14px Manrope;display:block}.module small{color:var(--muted);display:block;margin-top:6px;font-size:11px}
.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.card{padding:19px;min-width:0}.card h3{font:700 14px Manrope;margin:0 0 15px}.muted{color:var(--muted)}.empty{padding:28px 15px;text-align:center;border:1px dashed #3a5055;border-radius:14px;color:var(--muted);line-height:1.6}.empty strong{display:block;color:var(--ink);margin-bottom:5px}.list{display:grid;gap:9px}.item{display:flex;align-items:center;gap:12px;padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:14px}.itemicon{width:39px;height:39px;border-radius:12px;background:#2b4038;color:var(--lime);display:grid;place-items:center;font-size:18px;flex:none}.itembody{flex:1;min-width:0}.itembody b{display:block;font-size:13px}.itembody small{display:block;color:var(--muted);margin-top:4px;font-size:11px}.pill{border-radius:30px;padding:6px 9px;background:#293d37;color:var(--lime);font-size:10px;white-space:nowrap}
.pagegrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:11px;color:var(--muted)}.field input,.field textarea,.field select{width:100%;background:#101b20;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px}.field textarea{min-height:80px;resize:vertical}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:15px 0}.map{height:440px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#d9e1d9}.maphint{color:var(--muted);font-size:11px;line-height:1.6;margin-top:10px}.route-layout{display:grid;grid-template-columns: minmax(260px,.72fr) minmax(0,1.28fr);gap:14px}.waypoint{display:flex;align-items:center;gap:8px;margin:8px 0}.waypoint input{min-width:0;flex:1;background:#101b20;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px}.waypoint button{background:#3d2b2b;color:#ffc7bd;border:0;border-radius:8px;padding:9px}
.back{margin-bottom:16px;background:none;border:0;color:var(--lime);padding:0;font-size:12px;font-weight:700}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:2000}.modal.open{display:flex}.dialog{width:min(540px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px}.dialog h2{font:700 20px Manrope;margin:0 0 18px}.dialogfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--lime);color:#18211b;font-weight:800;padding:12px 18px;border-radius:12px;z-index:3000;box-shadow:0 10px 35px #0005}
@media(max-width:800px){.app{padding:0 16px 40px}.top{height:65px}.hero{grid-template-columns:1fr;padding:23px}.hero-art{display:none}.stats{grid-template-columns:repeat(2,1fr)}.modules{grid-template-columns:repeat(2,1fr)}.grid2,.route-layout{grid-template-columns:1fr}.map{height:360px}.head{align-items:flex-start;flex-direction:column}.head>.btn{width:100%}.pagegrid{grid-template-columns:1fr}}
@media(max-width:390px){.modules{grid-template-columns:1fr 1fr;gap:8px}.module{padding:14px;min-height:125px}.stat{padding:13px}.stat b{font-size:23px}.topright .statuslabel{display:none}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><img src="./assets/cathal-road-icon.svg" alt=""><div><b>CATHAL ROAD</b><small>Ride beyond the usual</small></div></div><div class="topright"><span><i class="status"></i><span class="statuslabel">ESPAI PERSONAL</span></span><span id="today"></span></div></header>
<main id="view" aria-live="polite"><div class="empty"><strong>Carregant Cathal Road…</strong>Preparant el teu espai de carretera.</div></main>
</div>
<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
'use strict';
const KEY='cathal-road-v1';
const blank={bike:{},routes:[],trips:[],maintenance:[],gear:[],expenses:[],rides:[]};
function load(){try{const raw=JSON.parse(localStorage.getItem(KEY)||'{}');const d=raw&&typeof raw==='object'?raw:{};return {...blank,...d,bike:d.bike&&typeof d.bike==='object'?d.bike:{},...Object.fromEntries(['routes','trips','maintenance','gear','expenses','rides'].map(k=>[k,Array.isArray(d[k])?d[k].filter(x=>x&&typeof x==='object'):[]]))}}catch(e){return {...blank}}}
let data=load(),page='home',map=null,routeLayer=null,waypoints=[];
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>Number(v||0),km=v=>num(v).toLocaleString('ca-ES'),money=v=>num(v).toLocaleString('ca-ES',{style:'currency',currency:'EUR'});
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){toast('No s’han pogut desar les dades. Exporta una còpia.');return false}}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),2600)}
function heading(k,t,d,action){return '<div class="eyebrow">'+k+'</div><div class="head"><div><h1>'+t+'</h1><p>'+d+'</p></div>'+(action||'')+'</div>'}
function stat(label,value,note){return '<div class="stat"><span>'+label+'</span><b>'+value+'</b><small>'+note+'</small></div>'}
function module(icon,title,desc,target){return '<button class="module" data-page="'+target+'"><span class="ico">'+icon+'</span><b>'+title+'</b><small>'+desc+'</small></button>'}
function empty(title,desc,btn){return '<div class="empty"><strong>'+title+'</strong>'+desc+(btn||'')+'</div>'}
function item(icon,title,desc,tag){return '<div class="item"><div class="itemicon">'+icon+'</div><div class="itembody"><b>'+esc(title||'Sense títol')+'</b><small>'+esc(desc||'')+'</small></div>'+(tag?'<span class="pill">'+esc(tag)+'</span>':'')+'</div>'}
function home(){const total=data.rides.reduce((s,x)=>s+num(x.km),0),b=data.bike;return heading('EL TEU DIARI DE CARRETERA','La carretera t’espera.','Planifica, prepara la moto i guarda cada aventura.', '<button class="btn" data-action="ride">＋ Registrar sortida</button>')+'<section class="hero"><div><div class="eyebrow">RIDE · EXPLORE · REPEAT</div><h2>No és només arribar.<br>És tot el que passa pel camí.</h2><p>El teu centre de comandament per descobrir carreteres, organitzar viatges, cuidar la moto i conservar els records de cada quilòmetre.</p><button class="btn" data-page="routes">Dissenyar una ruta ↗</button></div><div class="hero-art">🏍️</div></section><div class="stats">'+stat('QUILÒMETRES',km(total)+' km','Distància registrada')+stat('RUTES DESADES',data.routes.length,'Idees per sortir')+stat('VIATGES',data.trips.length,'Aventures planificades')+stat('MANTENIMENTS',data.maintenance.length,'Intervencions anotades')+'</div><div class="sectionbar"><h2>El teu espai de viatge</h2><span>ACCÉS DIRECTE</span></div><div class="modules">'+module('⌖','Planificador de rutes','Mapa, punts i fitxers GPX','routes')+module('◫','Viatges i etapes','Organitza escapades de diversos dies','trips')+module('🏍','El meu garatge','Fitxa, revisions i manteniment','garage')+module('▣','Equipament','Prepara tot el que necessites','gear')+module('€','Despeses','Controla el cost de cada aventura','expenses')+module('◷','Quadern de ruta','Historial de sortides i quilòmetres','history')+'</div><div class="sectionbar"><h2>La teva moto</h2><span>GARATGE</span></div><div class="card">'+(b.name?item('🏍',b.name,[b.brand,b.model,b.year].filter(Boolean).join(' · '),' '+km(b.km)+' km'):empty('Encara no has presentat la teva moto','Crea la fitxa per tenir a mà dades, revisions i manteniment.','<button class="btn" data-page="garage">Crear fitxa de moto</button>'))+'</div><div class="sectionbar"><h2>Últimes aventures</h2><span>ACTIVITAT RECENT</span></div><div class="list">'+(data.rides.length?data.rides.slice(0,3).map(x=>item('🏁',x.name,x.date||'Sortida registrada',km(x.km)+' km')).join(''):empty('La teva història comença aquí','Quan facis la primera sortida, la guardarem en aquest quadern.'))+'</div>'}
function page(title,kicker,desc,content,action){return '<button class="back" data-page="home">← TORNAR A L’INICI</button>'+heading(kicker,title,desc,action)+content}
function listPage(key,title,kicker,desc,icon,fields,emptyTitle,emptyDesc){const arr=data[key];return page(title,kicker,desc,'<div class="toolbar"><span class="muted">'+arr.length+' registres</span><button class="btn" data-action="'+key+'">＋ Afegir</button></div><div class="list">'+(arr.length?arr.map(x=>item(icon,x.name||x.title||x.type,[x.date,x.detail,x.destination].filter(Boolean).join(' · '),x.km?km(x.km)+' km':x.cost?money(x.cost):'')).join(''):empty(emptyTitle,emptyDesc))+'</div>')}
function garage(){const b=data.bike;return page('El meu garatge','MÀQUINA I MANTENIMENT','La fitxa de la moto, les revisions i el seu historial.','<div class="card"><div class="toolbar"><h3>Fitxa del vehicle</h3><button class="btn secondary" data-action="bike">Editar</button></div>'+(b.name?item('🏍',b.name,[b.brand,b.model,b.year,b.plate].filter(Boolean).join(' · '),km(b.km)+' km'):empty('Encara no hi ha cap moto','Afegeix les dades bàsiques del teu vehicle.','<button class="btn" data-action="bike">Crear fitxa</button>'))+'</div><div class="sectionbar"><h2>Manteniment</h2><button class="btn secondary" data-action="maintenance">＋ Anotar revisió</button></div><div class="list">'+(data.maintenance.length?data.maintenance.map(x=>item('🔧',x.name,[x.date,x.km?km(x.km)+' km':'',x.detail].filter(Boolean).join(' · '),x.cost?money(x.cost):'')).join(''):empty('Tot tranquil al taller','Anota oli, pneumàtics, frens, cadena i revisions.'))+'</div>')}
function routePage(){return page('Planificador de rutes','MAPA I EXPLORACIÓ','Construeix el recorregut, afegeix parades i desa’l al teu quadern.','<div class="route-layout"><div class="card"><h3>El teu recorregut</h3><div class="field"><label>Nom de la ruta</label><input id="routeName" placeholder="Ex. Ports del Pirineu"></div><div class="field"><label>Punts del recorregut (adreça o població)</label><div id="waypoints"></div><button class="btn secondary" id="addPoint">＋ Afegir parada</button></div><div class="row"><button class="btn" id="buildRoute">Traçar ruta</button><button class="btn secondary" id="saveRoute">Desar</button></div><div class="toolbar"><button class="btn ghost" id="exportGpx">Exportar GPX</button><label class="btn ghost" for="gpxFile">Importar GPX</label><input class="hidden" id="gpxFile" type="file" accept=".gpx,application/gpx+xml"></div><p class="maphint">La ruta utilitza OpenStreetMap i el servei públic OSRM per calcular el trajecte. Per trobar una ubicació, escriu població, adreça o coordenades.</p></div><div><div id="map" class="map"></div><p class="maphint">Toca el mapa per afegir un punt. Pots moure els marcadors per ajustar el recorregut.</p></div></div><div class="sectionbar"><h2>Rutes desades</h2><span>'+data.routes.length+' EN EL TEU QUADERN</span></div><div class="list">'+(data.routes.length?data.routes.map(x=>item('⌖',x.name,[x.start,x.end].filter(Boolean).join(' → '),x.km?km(x.km)+' km':'Ruta')).join(''):empty('Cap ruta desada','Quan en creïs una, quedarà guardada aquí.'))+'</div>')}
function tripPage(){return listPage('trips','Els meus viatges','PLANIFICA L’AVENTURA','Organitza destinacions, dates i notes de cada escapada.','✦',null,'Encara no hi ha viatges','Crea el teu primer viatge i prepara les etapes.')}
function gearPage(){return listPage('gear','El meu equipament','PREPARACIÓ','Controla el material que tens i el que et falta.','◇',null,'Equipament pendent de preparar','Afegeix casc, jaqueta, guants, eines o equipatge.')}
function expensesPage(){const total=data.expenses.reduce((s,x)=>s+num(x.cost),0);return page('Despeses i pressupost','CONTROL DE COSTOS','Tingues clar què costa mantenir la moto i sortir a descobrir món.','<div class="stats">'+stat('TOTAL REGISTRAT',money(total),'Totes les despeses')+stat('MOVIMENTS',data.expenses.length,'Registres desats')+'</div><div class="toolbar"><span></span><button class="btn" data-action="expenses">＋ Afegir despesa</button></div><div class="list">'+(data.expenses.length?data.expenses.map(x=>item('€',x.name,x.date||x.detail,money(x.cost))).join(''):empty('Encara no hi ha despeses','Anota combustible, peatges, allotjaments i manteniment.'))+'</div>')}
function historyPage(){const total=data.rides.reduce((s,x)=>s+num(x.km),0);return page('Quadern de ruta','ELS TEUS RECORDS','Cada sortida forma part de la història.','<div class="stats">'+stat('QUILÒMETRES',km(total)+' km','Acumulats')+stat('SORTIDES',data.rides.length,'Aventures registrades')+'</div><div class="toolbar"><span></span><button class="btn" data-action="ride">＋ Registrar sortida</button></div><div class="list">'+(data.rides.length?data.rides.map(x=>item('🏁',x.name,[x.date,x.detail].filter(Boolean).join(' · '),km(x.km)+' km')).join(''):empty('Cap sortida registrada','Registra la primera aventura per començar el teu historial.'))+'</div>')}
function render(){if(map){map.remove();map=null}const views={home,garage,routes:routePage,trips:tripPage,gear:gearPage,expenses:expensesPage,history:historyPage};$('view').innerHTML=(views[page]||home)();if(page==='routes')initMap();window.scrollTo(0,0)}
function openForm(title,fields,callback){$('dialog').innerHTML='<h2>'+title+'</h2>'+fields.map(f=>'<div class="field"><label>'+f.label+'</label><input id="field-'+f.id+'" type="'+(f.type||'text')+'" placeholder="'+(f.placeholder||'')+'" '+(f.required?'required':'')+'></div>').join('')+'<div class="dialogfoot"><button class="btn secondary" data-close>Cancel·lar</button><button class="btn" id="formSave">Desar</button></div>';$('modal').classList.add('open');$('formSave').onclick=()=>{const v={};for(const f of fields){const el=$('field-'+f.id);v[f.id]=el.value.trim();if(f.required&&!v[f.id]){el.focus();return}}callback(v);save();$('modal').classList.remove('open');render();toast('Desat correctament')}}
function formAction(a){const forms={
bike:['Fitxa de la moto',[{id:'name',label:'Nom de la moto',required:true},{id:'brand',label:'Marca'},{id:'model',label:'Model'},{id:'year',label:'Any',type:'number'},{id:'plate',label:'Matrícula'},{id:'km',label:'Quilometratge',type:'number'},{id:'itv',label:'Venciment ITV',type:'date'},{id:'insurance',label:'Venciment assegurança',type:'date'}],v=>data.bike={...data.bike,...v}],
ride:['Registrar sortida',[{id:'name',label:'Nom de la sortida',required:true},{id:'date',label:'Data',type:'date'},{id:'km',label:'Quilòmetres',type:'number',required:true},{id:'detail',label:'Notes i records'}],v=>data.rides.unshift(v)],
maintenance:['Anotar manteniment',[{id:'name',label:'Intervenció',required:true},{id:'date',label:'Data',type:'date'},{id:'km',label:'Quilometratge',type:'number'},{id:'cost',label:'Cost (€)',type:'number'},{id:'detail',label:'Detalls'}],v=>data.maintenance.unshift(v)],
routes:['Desar ruta',[{id:'name',label:'Nom de la ruta',required:true},{id:'start',label:'Sortida'},{id:'end',label:'Arribada'},{id:'km',label:'Distància (km)',type:'number'},{id:'detail',label:'Notes'}],v=>data.routes.unshift(v)],
trips:['Planificar viatge',[{id:'name',label:'Nom del viatge',required:true},{id:'start',label:'Data de sortida',type:'date'},{id:'end',label:'Data de tornada',type:'date'},{id:'destination',label:'Destinació'},{id:'detail',label:'Etapes i allotjaments'}],v=>data.trips.unshift(v)],
gear:['Afegir equipament',[{id:'name',label:'Material',required:true},{id:'type',label:'Categoria'},{id:'detail',label:'Notes'}],v=>data.gear.unshift(v)],
expenses:['Afegir despesa',[{id:'name',label:'Concepte',required:true},{id:'date',label:'Data',type:'date'},{id:'cost',label:'Import (€)',type:'number',required:true},{id:'detail',label:'Notes'}],v=>data.expenses.unshift(v)]
};const f=forms[a];if(f)openForm(f[0],f[1],f[2])}
function initMap(){if(!window.L){$('map').innerHTML='<div class="empty">El mapa no s’ha pogut carregar. Comprova la connexió a internet.</div>';return}map=L.map('map').setView([41.6,1.7],8);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);routeLayer=L.layerGroup().addTo(map);waypoints=[];addWaypointInput();map.on('click',e=>{waypoints.push({lat:e.latlng.lat,lon:e.latlng.lng,label:e.latlng.lat.toFixed(4)+', '+e.latlng.lng.toFixed(4)});drawPoints();syncWaypointInputs()});setTimeout(()=>map.invalidateSize(),150)}
function addWaypointInput(){const id=waypoints.length;const wrap=document.createElement('div');wrap.className='waypoint';wrap.innerHTML='<input placeholder="Població o adreça" aria-label="Punt de ruta"><button type="button" aria-label="Eliminar punt">×</button>';wrap.querySelector('button').onclick=()=>{waypoints.splice(id,1);syncWaypointInputs()};wrap.querySelector('input').onchange=async e=>{const q=e.target.value.trim();if(!q)return;try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));const j=await r.json();if(!j.length){toast('No he trobat aquesta ubicació');return}waypoints[id]={lat:Number(j[0].lat),lon:Number(j[0].lon),label:q};drawPoints()}catch(err){toast('No s’ha pogut cercar la ubicació')}};$('waypoints').append(wrap)}
function syncWaypointInputs(){if(!$('waypoints'))return;$('waypoints').innerHTML='';const old=[...waypoints];waypoints=[];old.forEach((p,i)=>{waypoints.push(p);addWaypointInput();const input=$('waypoints').children[i]?.querySelector('input');if(input)input.value=p.label||''});if(!waypoints.length)addWaypointInput();drawPoints()}
function drawPoints(){if(!map||!routeLayer)return;routeLayer.clearLayers();waypoints.forEach((p,i)=>L.marker([p.lat,p.lon]).addTo(routeLayer).bindPopup((i+1)+'. '+esc(p.label||'Punt')));if(waypoints.length>1)map.fitBounds(waypoints.map(p=>[p.lat,p.lon]),{padding:[30,30]})}
async function buildRoute(){const pts=waypoints.filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lon));if(pts.length<2){toast('Afegeix com a mínim dos punts');return}try{const coords=pts.map(p=>p.lon+','+p.lat).join(';');const r=await fetch('https://router.project-osrm.org/route/v1/driving/'+coords+'?overview=full&geometries=geojson&steps=true');const j=await r.json();if(!j.routes?.length)throw Error('no route');const route=j.routes[0];L.geoJSON(route.geometry,{style:{color:'#c7e36a',weight:5,opacity:.9}}).addTo(routeLayer);map.fitBounds(L.geoJSON(route.geometry).getBounds(),{padding:[25,25]});window.currentRoute={distance:route.distance/1000,duration:route.duration/3600,geometry:route.geometry,steps:route.legs.flatMap(l=>l.steps).map(s=>s.name).filter(Boolean)};toast('Ruta calculada: '+km(route.distance/1000)+' km')}catch(e){toast('No s’ha pogut calcular el recorregut. Prova altres punts.')}}
function saveRoute(){if(!waypoints.length){toast('Afegeix punts al mapa');return}const name=$('routeName').value.trim();if(!name){$('routeName').focus();toast('Posa un nom a la ruta');return}const r=window.currentRoute||{};data.routes.unshift({name,start:waypoints[0]?.label,end:waypoints.at(-1)?.label,km:r.distance||0,detail:waypoints.map(p=>p.label).join(' → '),points:waypoints,geometry:r.geometry||null});save();toast('Ruta desada al quadern')}
function exportGPX(){if(!waypoints.length){toast('No hi ha punts per exportar');return}const pts=waypoints.map(p=>'<wpt lat="'+p.lat+'" lon="'+p.lon+'"><name>'+esc(p.label)+'</name></wpt>').join('');const tr=window.currentRoute?.geometry?.coordinates||waypoints.map(p=>[p.lon,p.lat]);const track=tr.map(p=>'<trkpt lat="'+p[1]+'" lon="'+p[0]+'"></trkpt>').join('');const xml='<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="Cathal Road" xmlns="http://www.topografix.com/GPX/1/1">'+pts+'<trk><name>'+esc($('routeName').value||'Cathal Road')+'</name><trkseg>'+track+'</trkseg></trk></gpx>';download(xml,'cathal-road.gpx','application/gpx+xml')}
function download(content,name,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function importGPX(file){const reader=new FileReader();reader.onload=()=>{try{const doc=new DOMParser().parseFromString(reader.result,'application/xml');const nodes=[...doc.querySelectorAll('wpt,trkpt,rtept')];if(!nodes.length)throw Error();waypoints=nodes.map(n=>({lat:Number(n.getAttribute('lat')),lon:Number(n.getAttribute('lon')),label:n.querySelector('name')?.textContent||'Punt GPX'})).filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lon));syncWaypointInputs();if(waypoints.length>1)buildRoute();toast('GPX importat')}catch(e){toast('Aquest fitxer GPX no és vàlid')}};reader.readAsText(file)}
function backup(){download(JSON.stringify(data,null,2),'cathal-road-backup.json','application/json')}
function importBackup(file){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=='object')throw Error();data={...blank,...d};save();render();toast('Còpia recuperada')}catch(e){toast('La còpia no és vàlida')}};r.readAsText(file)}
document.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){page=p.dataset.page;render();return}const a=e.target.closest('[data-action]');if(a){formAction(a.dataset.action);return}if(e.target.closest('[data-close]'))$('modal').classList.remove('open')});
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('open')});
$('view').addEventListener('click',e=>{if(e.target.id==='addPoint'){addWaypointInput()}if(e.target.id==='buildRoute')buildRoute();if(e.target.id==='saveRoute')saveRoute();if(e.target.id==='exportGpx')exportGPX()});
$('view').addEventListener('change',e=>{if(e.target.id==='gpxFile'&&e.target.files[0])importGPX(e.target.files[0])});
$('today').textContent=new Intl.DateTimeFormat('ca-ES',{weekday:'short',day:'numeric',month:'short'}).format(new Date());
window.addEventListener('error',e=>{console.error(e.error);if(!$('view').innerHTML.trim())$('view').innerHTML=empty('S’ha produït un error','Torna a carregar la pàgina.','<button class="btn" onclick="location.reload()">Recarregar</button>')});
window.addEventListener('unhandledrejection',e=>console.error('Cathal Road:',e.reason));
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></main></div></body></html>
