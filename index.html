<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111315"><meta name="description" content="El teu centre de comandament per a la moto i els viatges.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/cathal-road-icon.jpg"><link rel="apple-touch-icon" href="assets/cathal-road-icon.jpg">
<title>Cathal Road</title>
<style>
:root{--bg:#101214;--panel:#1a1e21;--panel2:#22282c;--line:#30383d;--text:#f2f3f3;--muted:#9aa4aa;--accent:#f28b35;--accent2:#ffc06d;--danger:#ed665d;--green:#80bd8b;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#29343a 0,#101214 55%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;padding-bottom:92px}
header{padding:calc(16px + env(safe-area-inset-top)) 18px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#111416ed;backdrop-filter:blur(14px);z-index:5;border-bottom:1px solid #ffffff0d}
.logo{width:44px;height:44px;border-radius:13px;object-fit:cover;border:1px solid #ffffff30}.brand{flex:1}.brand b{font-size:17px;letter-spacing:1.7px}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:1.4px;text-transform:uppercase}.avatar{width:38px;height:38px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;color:var(--accent);font-size:19px}
main{max-width:760px;margin:auto;padding:18px 16px 20px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.hero{padding:8px 2px 18px}.hero h1{font-size:29px;line-height:1.1;margin:8px 0}.hero p{margin:8px 0 0;color:var(--muted);line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0 22px}.stat{background:linear-gradient(145deg,#22292d,#191d20);border:1px solid var(--line);border-radius:15px;padding:13px 11px}.stat strong{font-size:22px;display:block}.stat span{color:var(--muted);font-size:11px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 11px}.section-head h2{font-size:17px;margin:0}.section-head small{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile,.card{background:linear-gradient(145deg,#202629,#191d20);border:1px solid var(--line);border-radius:var(--radius);padding:15px;min-width:0}.tile{min-height:126px;cursor:pointer;transition:.15s}.tile:active,.btn:active{transform:scale(.98)}.tile .ico{font-size:24px;margin-bottom:10px}.tile b{display:block;font-size:14px}.tile small{display:block;color:var(--muted);font-size:11px;margin-top:4px;line-height:1.35}
.card{margin-bottom:10px}.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}.row b{font-size:14px}.muted{color:var(--muted)}.sub{font-size:12px;color:var(--muted);margin-top:3px}.pill{font-size:10px;color:var(--accent2);background:#f28b351c;border:1px solid #f28b3540;padding:5px 8px;border-radius:20px;white-space:nowrap}
.btn{border:0;border-radius:12px;background:var(--accent);color:#171717;font-weight:800;padding:12px 15px;font-size:13px;cursor:pointer}.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn.ghost{background:transparent;color:var(--accent2);padding:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.empty{text-align:center;padding:24px 12px;color:var(--muted)}.empty .ico{font-size:30px;margin-bottom:7px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:8;background:#15191ced;backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 5px calc(8px + env(safe-area-inset-bottom))}
nav button{border:0;background:none;color:#849097;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:54px;padding:5px 3px;cursor:pointer}nav button span{font-size:19px}nav button.active{color:var(--accent2)}
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:flex-end;justify-content:center;padding:12px}.modal.show{display:flex}.sheet{background:#1a1f22;border:1px solid var(--line);border-radius:22px 22px 14px 14px;padding:20px;width:min(100%,560px);max-height:88vh;overflow:auto}.sheet h2{margin:0 0 16px}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;background:#101416;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:12px;font:inherit;outline:none}.field textarea{min-height:75px;resize:vertical}.form-actions{display:flex;gap:9px;margin-top:18px}.form-actions>*{flex:1}
.item-icon{width:42px;height:42px;border-radius:13px;background:#f28b3518;display:grid;place-items:center;font-size:21px;flex:none}
.notice{font-size:12px;color:var(--muted);line-height:1.5;background:#f28b350d;border:1px solid #f28b352b;border-radius:13px;padding:12px;margin-top:15px}
@media(min-width:650px){main{padding:24px}.hero h1{font-size:36px}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header><img class="logo" src="assets/cathal-road-icon.jpg" alt="Cathal Road"><div class="brand"><b>CATHAL ROAD</b><small>Ride · Explore · Remember</small></div><div class="avatar">🏍</div></header>
<main id="app"></main>
<nav id="nav">
<button data-tab="home" class="active"><span>⌂</span>Inici</button>
<button data-tab="bike"><span>🏍</span>La moto</button>
<button data-tab="routes"><span>🗺</span>Rutes</button>
<button data-tab="trips"><span>🧭</span>Viatges</button>
<button data-tab="more"><span>▦</span>Més</button>
</nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const KEY='cathal-road-v1';
let data=JSON.parse(localStorage.getItem(KEY)||'{"bike":{},"routes":[],"trips":[],"maintenance":[],"gear":[],"expenses":[],"rides":[]}');
let tab='home';
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const euro=n=>Number(n||0).toLocaleString('ca-ES',{style:'currency',currency:'EUR'});
function openForm(title,fields,onSave){const modal=document.getElementById('modal'),sheet=document.getElementById('sheet');sheet.innerHTML='<h2>'+title+'</h2>'+fields.map(f=>'<div class="field"><label>'+f.label+'</label><input id="f-'+f.id+'" type="'+(f.type||'text')+'" placeholder="'+(f.placeholder||'')+'" '+(f.required?'required':'')+'></div>').join('')+'<div class="form-actions"><button class="btn secondary" id="cancel">Cancel·lar</button><button class="btn" id="save">Desar</button></div>';modal.classList.add('show');document.getElementById('cancel').onclick=()=>modal.classList.remove('show');document.getElementById('save').onclick=()=>{let v={};for(const f of fields){let el=document.getElementById('f-'+f.id);v[f.id]=el.value.trim();if(f.required&&!v[f.id]){el.focus();return}}onSave(v);modal.classList.remove('show');save();render()}}
function card(icon,title,desc,right=''){return '<div class="card"><div class="row"><div class="item-icon">'+icon+'</div><div class="grow"><b>'+esc(title)+'</b><div class="sub">'+esc(desc)+'</div></div>'+right+'</div></div>'}
function listBlock(items,icon,empty,extra=''){return items.length?items.map((x,i)=>card(icon,x.name||x.title||x.type||'Registre',x.detail||x.date||'', '<span class="pill">'+(x.status||'Guardat')+'</span>')).join(''):'<div class="card empty"><div class="ico">'+icon+'</div>'+empty+'</div>'}
function home(){let km=data.rides.reduce((s,x)=>s+Number(x.km||0),0);return '<div class="hero"><div class="eyebrow">EL TEU GARATGE, LES TEVES AVENTURES</div><h1>Preparat per<br><span style="color:var(--accent)">la pròxima ruta?</span></h1><p>Tot el que necessites per tenir la moto a punt i gaudir de cada quilòmetre.</p></div><div class="stats"><div class="stat"><strong>'+km.toLocaleString('ca-ES')+'</strong><span>KM registrats</span></div><div class="stat"><strong>'+data.routes.length+'</strong><span>Rutes guardades</span></div><div class="stat"><strong>'+data.trips.length+'</strong><span>Viatges</span></div></div><div class="section-head"><h2>El teu espai</h2><small>Accés ràpid</small></div><div class="grid"><div class="tile" onclick="go('bike')"><div class="ico">🏍️</div><b>La meva moto</b><small>Fitxa, revisions i manteniment</small></div><div class="tile" onclick="go('routes')"><div class="ico">🗺️</div><b>Planificar ruta</b><small>Guarda recorreguts i GPX</small></div><div class="tile" onclick="go('trips')"><div class="ico">🧭</div><b>Organitzar viatge</b><small>Etapes, allotjament i pressupost</small></div><div class="tile" onclick="go('more')"><div class="ico">🎒</div><b>Equipament</b><small>Material i accessoris</small></div></div><div class="section-head"><h2>Últimes activitats</h2></div>'+listBlock(data.rides.slice(-3).reverse(),'🏁','Encara no has registrat cap sortida.')+'<div class="notice">🔒 Les teves dades es desen en aquest dispositiu. En aquesta primera versió encara no se sincronitzen entre dispositius.</div>'}
function bike(){let b=data.bike;return '<div class="hero"><div class="eyebrow">EL TEU GARATGE</div><h1>La meva moto</h1><p>Fitxa personal i manteniment al dia.</p></div><div class="card"><div class="row"><div class="item-icon">🏍️</div><div class="grow"><b>'+(esc(b.name)||'Afegeix la teva moto')+'</b><div class="sub">'+esc([b.brand,b.model,b.year].filter(Boolean).join(' · ')||'Encara no hi ha cap fitxa')+'</div></div><button class="btn secondary" onclick="editBike()">Editar</button></div>'+(b.plate||b.km?'<div class="stats"><div class="stat"><strong>'+esc(b.km||'—')+'</strong><span>Quilometratge km</span></div><div class="stat"><strong>'+esc(b.plate||'—')+'</strong><span>Matrícula</span></div><div class="stat"><strong>'+esc(b.itv||'—')+'</strong><span>ITV</span></div></div>':'')+'</div><div class="section-head"><h2>Manteniment i revisions</h2><button class="btn" onclick="addMaintenance()">+ Afegir</button></div>'+listBlock(data.maintenance,'🔧','Encara no has anotat cap revisió.')+'<div class="section-head"><h2>Registra una sortida</h2><button class="btn" onclick="addRide()">+ Sortida</button></div>'+listBlock(data.rides.slice(-4).reverse(),'🏁','Registra els quilòmetres de les teves sortides.')+' '}
function editBike(){openForm('Fitxa de la moto',[{id:'name',label:'Nom de la moto',required:true},{id:'brand',label:'Marca'},{id:'model',label:'Model'},{id:'year',label:'Any',type:'number'},{id:'plate',label:'Matrícula'},{id:'km',label:'Quilometratge actual (km)',type:'number'},{id:'itv',label:'Venciment ITV',type:'date'},{id:'insurance',label:'Venciment assegurança',type:'date'}],v=>{data.bike={...data.bike,...v}})}
function addMaintenance(){openForm('Anotar manteniment',[{id:'name',label:'Què has fet?',placeholder:'Canvi d’oli, pneumàtics...',required:true},{id:'date',label:'Data',type:'date'},{id:'km',label:'Quilometratge (km)',type:'number'},{id:'cost',label:'Cost (€)',type:'number'},{id:'detail',label:'Notes'}],v=>data.maintenance.unshift(v))}
function addRide(){openForm('Registrar sortida',[{id:'name',label:'Nom de la sortida',required:true},{id:'date',label:'Data',type:'date'},{id:'km',label:'Quilòmetres recorreguts',type:'number',required:true},{id:'detail',label:'Notes'}],v=>data.rides.unshift(v))}
function routes(){return '<div class="hero"><div class="eyebrow">CARRETERES I CAMINS</div><h1>Les meves rutes</h1><p>Planifica idees, desa recorreguts i prepara la pròxima escapada.</p></div><button class="btn" onclick="addRoute()">+ Nova ruta</button><div class="section-head"><h2>Rutes guardades</h2><small>'+data.routes.length+' en total</small></div>'+listBlock(data.routes,'🗺️','Encara no tens cap ruta guardada.')+'<div class="notice">La importació i exportació GPX i el mapa amb navegació seran les properes millores. Aquesta primera versió permet guardar les dades bàsiques de cada ruta.</div>'}
function addRoute(){openForm('Nova ruta',[{id:'name',label:'Nom de la ruta',required:true},{id:'start',label:'Punt de sortida'},{id:'end',label:'Destinació'},{id:'km',label:'Distància aproximada (km)',type:'number'},{id:'duration',label:'Durada estimada'},{id:'detail',label:'Notes i punts d’interès'}],v=>data.routes.unshift(v))}
function trips(){return '<div class="hero"><div class="eyebrow">ESCAPADES I AVENTURES</div><h1>Els meus viatges</h1><p>Organitza cada etapa, allotjament i despesa en un sol lloc.</p></div><button class="btn" onclick="addTrip()">+ Planificar viatge</button><div class="section-head"><h2>Viatges planificats</h2></div>'+listBlock(data.trips,'🧭','Encara no has planificat cap viatge.')+'<div class="notice">En les properes versions afegirem el detall de les etapes per dies, allotjaments, pressupost i llistes de material.</div>'}
function addTrip(){openForm('Nou viatge',[{id:'name',label:'Nom del viatge',required:true},{id:'start',label:'Data de sortida',type:'date'},{id:'end',label:'Data de tornada',type:'date'},{id:'destination',label:'Destinació'},{id:'detail',label:'Idees, etapes i allotjaments'}],v=>data.trips.unshift(v))}
function more(){return '<div class="hero"><div class="eyebrow">TOT SOTA CONTROL</div><h1>Més eines</h1><p>Material, despeses i el teu historial de carretera.</p></div><div class="section-head"><h2>Equipament</h2><button class="btn" onclick="addGear()">+ Afegir</button></div>'+listBlock(data.gear,'🎒','Encara no has afegit equipament.')+'<div class="section-head"><h2>Despeses</h2><button class="btn" onclick="addExpense()">+ Afegir</button></div>'+listBlock(data.expenses.slice(-5).reverse(),'💶','Encara no hi ha despeses registrades.')+'<div class="section-head"><h2>Resum</h2></div>'+card('🏁','Sortides registrades',data.rides.length+' sortides · '+data.rides.reduce((s,x)=>s+Number(x.km||0),0)+' km')+card('🔧','Manteniments',data.maintenance.length+' intervencions anotades')+card('🧳','Viatges i rutes',data.trips.length+' viatges · '+data.routes.length+' rutes')+'<div class="notice">Les dades es guarden al navegador del mòbil. No esborris les dades del lloc web si vols conservar-les.</div>'}
function addGear(){openForm('Afegir equipament',[{id:'name',label:'Material o accessori',required:true},{id:'type',label:'Categoria',placeholder:'Casc, guants, eines...'},{id:'detail',label:'Notes'}],v=>data.gear.unshift(v))}
function addExpense(){openForm('Nova despesa',[{id:'name',label:'Concepte',required:true},{id:'date',label:'Data',type:'date'},{id:'cost',label:'Import (€)',type:'number',required:true},{id:'detail',label:'Notes'}],v=>data.expenses.unshift(v))}
function go(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
function render(){document.getElementById('app').innerHTML=({home,bike,routes,trips,more}[tab]||home)()}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('show')});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script>
</body></html>
