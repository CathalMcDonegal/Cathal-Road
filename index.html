<!doctype html>
<html lang="ca"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101a1d"><meta name="description" content="Cathal Road — el teu centre de comandament per viatjar en moto.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/cathal-road-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<title>Cathal Road</title>
<style>
:root{--bg:#101a1d;--surface:#19272a;--surface2:#213337;--line:#304448;--ink:#f3f4ed;--muted:#9eafaa;--lime:#c9e66b;--gold:#e4a66a;--red:#e27c70;--r:20px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px 'DM Sans',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1440px;margin:auto;padding:0 26px 60px}.top{height:76px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);position:sticky;top:0;background:#101a1def;backdrop-filter:blur(18px);z-index:500}.brand{display:flex;align-items:center;gap:12px}.brand img{width:43px;height:43px;border-radius:13px}.brand b{font:800 15px Manrope;letter-spacing:2px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px;margin-top:3px}.topmeta{color:var(--muted);font-size:11px}.dot{display:inline-block;width:7px;height:7px;background:var(--lime);border-radius:50%;margin-right:7px}main{padding-top:30px}.eyebrow{font-size:10px;color:var(--lime);font-weight:800;letter-spacing:2px}.heading{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:9px 0 24px}.heading h1{font:700 clamp(28px,4vw,43px)/1.1 Manrope;letter-spacing:-1.5px;margin:0}.heading p{color:var(--muted);margin:9px 0 0;line-height:1.6}.btn{border:0;border-radius:11px;padding:12px 16px;background:var(--lime);color:#17211a;font-size:12px;font-weight:800}.btn.alt{background:var(--surface2);border:1px solid var(--line);color:var(--ink)}.btn.line{background:transparent;border:1px solid var(--line);color:var(--muted)}.hero{background:linear-gradient(115deg,#2a4039,#1b2e31 70%);border:1px solid #42574b;border-radius:26px;padding:30px;display:grid;grid-template-columns:1.2fr .8fr;align-items:center;overflow:hidden;position:relative}.hero h2{font:700 clamp(26px,3.6vw,42px)/1.1 Manrope;margin:13px 0;max-width:570px}.hero p{color:#c1d0c8;line-height:1.7;max-width:500px}.bikeart{font-size:clamp(90px,14vw,170px);text-align:center;filter:drop-shadow(0 15px 20px #0005);transform:rotate(-10deg)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0 30px}.stat,.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}.stat{padding:17px}.stat span{font-size:10px;color:var(--muted);letter-spacing:.6px}.stat b{display:block;font:700 26px Manrope;margin:8px 0 2px}.stat small{color:var(--muted);font-size:10px}.bar{display:flex;justify-content:space-between;align-items:center;margin:28px 0 13px}.bar h2{font:700 17px Manrope;margin:0}.bar span{font-size:10px;color:var(--muted);letter-spacing:1px}.modules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.module{padding:19px;text-align:left;min-height:142px;background:var(--surface);border:1px solid var(--line);border-radius:18px;color:var(--ink);transition:.18s}.module:hover{background:var(--surface2);border-color:#829d55;transform:translateY(-2px)}.module i{font-style:normal;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#30443a;color:var(--lime);font-size:21px;margin-bottom:15px}.module b{display:block;font:700 14px Manrope}.module small{display:block;color:var(--muted);margin-top:6px;font-size:11px}.card{padding:19px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.list{display:grid;gap:9px}.entry{display:flex;gap:12px;align-items:center;padding:13px;background:var(--surface);border:1px solid var(--line);border-radius:14px}.entry .symbol{width:39px;height:39px;border-radius:12px;background:#30443a;color:var(--lime);display:grid;place-items:center;font-size:18px;flex:none}.entry .copy{min-width:0;flex:1}.entry b{display:block;font-size:13px}.entry small{display:block;color:var(--muted);margin-top:4px;font-size:11px}.tag{background:#30443a;color:var(--lime);padding:6px 9px;border-radius:30px;font-size:10px;white-space:nowrap}.empty{padding:28px 15px;border:1px dashed #3a5150;border-radius:14px;text-align:center;color:var(--muted);line-height:1.6}.empty b{display:block;color:var(--ink);margin-bottom:5px}.back{border:0;background:none;color:var(--lime);font-size:11px;font-weight:800;padding:0;margin-bottom:17px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:15px 0}.field{display:grid;gap:6px;margin:0 0 12px}.field label{font-size:11px;color:var(--muted)}.field input,.field textarea,.field select,.point input{width:100%;padding:12px;background:#111e21;border:1px solid var(--line);border-radius:10px;color:var(--ink)}.field textarea{min-height:75px}.point{display:flex;gap:7px;margin:8px 0}.point input{flex:1;min-width:0}.point button{border:0;background:#4b3030;color:#ffd5ce;border-radius:9px;padding:0 12px}.map{height:440px;border-radius:17px;overflow:hidden;border:1px solid var(--line);background:#dce3da}.routegrid{display:grid;grid-template-columns:minmax(260px,.7fr) minmax(0,1.3fr);gap:14px}.muted{color:var(--muted)}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:1000}.modal.open{display:flex}.dialog{width:min(520px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px}.dialog h2{font:700 20px Manrope;margin:0 0 18px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:1200;background:var(--lime);color:#17211a;font-weight:800;padding:12px 18px;border-radius:12px;box-shadow:0 8px 30px #0006}.danger{color:var(--red)}.hidden{display:none!important}
@media(max-width:800px){.shell{padding:0 15px 40px}.top{height:65px}.hero{grid-template-columns:1fr;padding:23px}.bikeart{display:none}.stats{grid-template-columns:repeat(2,1fr)}.modules{grid-template-columns:repeat(2,1fr)}.grid,.routegrid{grid-template-columns:1fr}.map{height:360px}.heading{align-items:flex-start;flex-direction:column}.heading>.btn{width:100%}}@media(max-width:390px){.module{padding:14px;min-height:130px}.stat{padding:13px}.stat b{font-size:22px}}
</style></head><body><div class="shell">
<header class="top"><div class="brand"><img src="./assets/cathal-road-icon.svg" alt=""><div><b>CATHAL ROAD</b><small>RIDE BEYOND THE USUAL</small></div></div><div class="topmeta"><span class="dot"></span>EL TEU ESPAI PERSONAL <span id="date"></span></div></header>
<main id="app"><div class="empty"><b>Iniciant Cathal Road…</b>Si l'aplicació no pot iniciar-se, veuràs aquí l'avís corresponent.</div></main>
</div><div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id), KEY='cathal-road-v1';
const fresh=()=>({bike:{},routes:[],trips:[],maintenance:[],gear:[],expenses:[],rides:[]});
let db=load(),section='home',map=null,markers=null,points=[],calculated=null;
function load(){try{let v=JSON.parse(localStorage.getItem(KEY)||'null');if(!v||typeof v!=='object')return fresh();let d={...fresh(),...v};['routes','trips','maintenance','gear','expenses','rides'].forEach(k=>d[k]=Array.isArray(d[k])?d[k].filter(x=>x&&typeof x==='object'):[]);d.bike=d.bike&&typeof d.bike==='object'?d.bike:{};return d}catch(e){return fresh()}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){notify('No s’han pogut desar les dades. Fes una còpia de seguretat.');return false}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function n(v){return Number(v)||0}function fmt(v){return n(v).toLocaleString('ca-ES')}function eur(v){return n(v).toLocaleString('ca-ES',{style:'currency',currency:'EUR'})}
function notify(s){let e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),2500)}
function stat(a,b,c){return '<div class="stat"><span>'+a+'</span><b>'+b+'</b><small>'+c+'</small></div>'}
function mod(i,t,d,p){return '<button class="module" data-page="'+p+'"><i>'+i+'</i><b>'+t+'</b><small>'+d+'</small></button>'}
function entry(i,t,d,tag){return '<div class="entry"><div class="symbol">'+i+'</div><div class="copy"><b>'+esc(t||'Sense títol')+'</b><small>'+esc(d||'')+'</small></div>'+(tag?'<span class="tag">'+esc(tag)+'</span>':'')+'</div>'}
function empty(t,d,button){return '<div class="empty"><b>'+t+'</b>'+d+(button||'')+'</div>'}
function head(k,t,d,button){return '<button class="back" data-page="home">← INICI</button><div class="eyebrow">'+k+'</div><div class="heading"><div><h1>'+t+'</h1><p>'+d+'</p></div>'+(button||'')+'</div>'}
function home(){let total=db.rides.reduce((s,x)=>s+n(x.km),0),b=db.bike;return '<div class="eyebrow">EL TEU DIARI DE CARRETERA</div><div class="heading"><div><h1>La carretera t’espera.</h1><p>Planifica, prepara la moto i guarda cada aventura.</p></div><button class="btn" data-form="ride">＋ Registrar sortida</button></div><section class="hero"><div><div class="eyebrow">RIDE · EXPLORE · REPEAT</div><h2>No és només arribar.<br>És tot el que passa pel camí.</h2><p>El teu centre de comandament per descobrir carreteres, organitzar viatges, cuidar la moto i conservar els records de cada quilòmetre.</p><button class="btn" data-page="routes">DISSENYAR UNA RUTA ↗</button></div><div class="bikeart">🏍️</div></section><div class="stats">'+stat('QUILÒMETRES',fmt(total)+' km','Sortides registrades')+stat('RUTES DESADES',db.routes.length,'Al teu quadern')+stat('VIATGES',db.trips.length,'Aventures')+stat('MANTENIMENTS',db.maintenance.length,'Intervencions')+'</div><div class="bar"><h2>El teu espai de viatge</h2><span>ACCÉS DIRECTE</span></div><div class="modules">'+mod('⌖','Rutes i mapa','Dissenya recorreguts i exporta GPX','routes')+mod('✦','Viatges i etapes','Organitza escapades de diversos dies','trips')+mod('🏍','El meu garatge','Fitxa, revisions i manteniment','garage')+mod('◇','Equipament','Prepara tot el que necessites','gear')+mod('€','Despeses','Controla el cost de cada aventura','expenses')+mod('◷','Quadern de ruta','Historial i quilòmetres','history')+'</div><div class="bar"><h2>La teva moto</h2><span>GARATGE</span></div><div class="card">'+(b.name?entry('🏍',b.name,[b.brand,b.model,b.year].filter(Boolean).join(' · '),fmt(b.km)+' km'):empty('Presenta’ns la teva moto','Crea la fitxa per tenir a mà les seves dades.','<button class="btn" data-form="bike">Crear fitxa</button>'))+'</div><div class="bar"><h2>Últimes aventures</h2><span>ACTIVITAT RECENT</span></div><div class="list">'+(db.rides.length?db.rides.slice(0,3).map(x=>entry('🏁',x.name,x.date,fmt(x.km)+' km')).join(''):empty('La teva història comença aquí','Registra la primera sortida quan tornis de carretera.'))+'</div>'}
function listPage(key,title,kicker,desc,icon){let a=db[key];return head(kicker,title,desc,'<button class="btn" data-form="'+key+'">＋ Afegir</button>')+'<div class="toolbar"><span class="muted">'+a.length+' registres</span><button class="btn alt" data-backup>Fer còpia</button></div><div class="list">'+(a.length?a.map(x=>entry(icon,x.name||x.title||x.type,[x.date,x.destination,x.detail].filter(Boolean).join(' · '),x.km?fmt(x.km)+' km':x.cost?eur(x.cost):'')).join(''):empty('Encara no hi ha registres','Afegeix el primer i el guardarem al teu dispositiu.'))+'</div>'}
function garage(){let b=db.bike;return head('MÀQUINA I MANTENIMENT','El meu garatge','Fitxa de la moto, revisions i historial.','<button class="btn" data-form="bike">Editar moto</button>')+'<div class="card">'+(b.name?entry('🏍',b.name,[b.brand,b.model,b.year,b.plate].filter(Boolean).join(' · '),fmt(b.km)+' km'):empty('Encara no hi ha cap moto','Afegeix les dades bàsiques del vehicle.','<button class="btn" data-form="bike">Crear fitxa</button>'))+'</div><div class="bar"><h2>Manteniment</h2><button class="btn alt" data-form="maintenance">＋ Anotar revisió</button></div><div class="list">'+(db.maintenance.length?db.maintenance.map(x=>entry('🔧',x.name,[x.date,x.km?fmt(x.km)+' km':'',x.detail].filter(Boolean).join(' · '),x.cost?eur(x.cost):'')).join(''):empty('Tot tranquil al taller','Anota oli, pneumàtics, frens, cadena i revisions.'))+'</div>'}
function expenses(){let sum=db.expenses.reduce((s,x)=>s+n(x.cost),0);return head('CONTROL DE COSTOS','Despeses i pressupost','Tingues clar què costa mantenir la moto i sortir a descobrir món.','<button class="btn" data-form="expenses">＋ Afegir despesa</button>')+'<div class="stats">'+stat('TOTAL REGISTRAT',eur(sum),'Despeses acumulades')+stat('MOVIMENTS',db.expenses.length,'Registres')+'</div><div class="list">'+(db.expenses.length?db.expenses.map(x=>entry('€',x.name,x.date||x.detail,eur(x.cost))).join(''):empty('Encara no hi ha despeses','Anota combustible, peatges, allotjaments i manteniment.'))+'</div>'}
function history(){let sum=db.rides.reduce((s,x)=>s+n(x.km),0);return head('ELS TEUS RECORDS','Quadern de ruta','Cada sortida forma part de la història.','<button class="btn" data-form="ride">＋ Registrar sortida</button>')+'<div class="stats">'+stat('QUILÒMETRES',fmt(sum)+' km','Acumulats')+stat('SORTIDES',db.rides.length,'Aventures')+'</div><div class="list">'+(db.rides.length?db.rides.map(x=>entry('🏁',x.name,[x.date,x.detail].filter(Boolean).join(' · '),fmt(x.km)+' km')).join(''):empty('Cap sortida registrada','Registra la primera aventura per començar el teu historial.'))+'</div>'}
function routes(){return head('MAPA I EXPLORACIÓ','Planificador de rutes','Dissenya el recorregut, afegeix parades i desa’l al teu quadern.')+'<div class="routegrid"><div class="card"><h3>El teu recorregut</h3><div class="field"><label>Nom de la ruta</label><input id="routeName" placeholder="Ex. Ports del Pirineu"></div><div class="field"><label>Parades i poblacions</label><div id="points"></div><button class="btn alt" id="addPoint">＋ Afegir parada</button></div><div class="toolbar"><button class="btn" id="calculate">Traçar ruta</button><button class="btn alt" id="saveRoute">Desar</button></div><div class="toolbar"><button class="btn line" id="exportGpx">Exportar GPX</button><label class="btn line" for="importGpx">Importar GPX</label><input id="importGpx" class="hidden" type="file" accept=".gpx"></div><p class="muted">Mapa OpenStreetMap. El càlcul de ruta necessita connexió. Toca el mapa per afegir punts i arrossega els marcadors per ajustar-los.</p></div><div><div id="map" class="map"></div><p class="muted">Els punts es poden afegir escrivint una població o tocant el mapa.</p></div></div><div class="bar"><h2>Rutes desades</h2><span>'+db.routes.length+' RUTES</span></div><div class="list">'+(db.routes.length?db.routes.map(x=>entry('⌖',x.name,x.detail,x.km?fmt(x.km)+' km':'Ruta')).join(''):empty('Encara no tens rutes','Quan en desis una, quedarà aquí guardada.'))+'</div>'}
function render(){try{if(map){map.remove();map=null}let pages={home,garage,routes,trips:()=>listPage('trips','Els meus viatges','PLANIFICA L’AVENTURA','Organitza destinacions, dates i notes.','✦'),gear:()=>listPage('gear','El meu equipament','PREPARACIÓ','Controla el material i el que et falta.','◇'),expenses,history};$('app').innerHTML=(pages[section]||home)();if(section==='routes')initMap();window.scrollTo(0,0)}catch(e){console.error(e);$('app').innerHTML=empty('No s’ha pogut obrir aquesta secció',esc(e.message),'<button class="btn" onclick="location.reload()">Reiniciar</button>')}}
const forms={
bike:['Fitxa de la moto',[['name','Nom de la moto',1],['brand','Marca'],['model','Model'],['year','Any'],['plate','Matrícula'],['km','Quilometratge'],['itv','Venciment ITV'],['insurance','Venciment assegurança']],v=>db.bike={...db.bike,...v}],
ride:['Registrar sortida',[['name','Nom de la sortida',1],['date','Data'],['km','Quilòmetres',1],['detail','Notes']],v=>db.rides.unshift(v)],
maintenance:['Anotar manteniment',[['name','Intervenció',1],['date','Data'],['km','Quilometratge'],['cost','Cost (€)'],['detail','Detalls']],v=>db.maintenance.unshift(v)],
trips:['Planificar viatge',[['name','Nom del viatge',1],['start','Data de sortida'],['end','Data de tornada'],['destination','Destinació'],['detail','Etapes i allotjaments']],v=>db.trips.unshift(v)],
gear:['Afegir equipament',[['name','Material',1],['type','Categoria'],['detail','Notes']],v=>db.gear.unshift(v)],
expenses:['Afegir despesa',[['name','Concepte',1],['date','Data'],['cost','Import (€)',1],['detail','Notes']],v=>db.expenses.unshift(v)]
};
function openForm(key){let f=forms[key];if(!f)return;$('dialog').innerHTML='<h2>'+f[0]+'</h2>'+f[1].map(([id,label,req])=>'<div class="field"><label>'+label+'</label><input id="f-'+id+'" '+(id==='date'||id==='start'||id==='end'||id==='itv'||id==='insurance'?'type="date"':id==='km'||id==='cost'||id==='year'?'type="number"':'type="text"')+' '+(req?'required':'')+'></div>').join('')+'<div class="actions"><button class="btn alt" data-close>Cancel·lar</button><button class="btn" id="submitForm">Desar</button></div>';$('modal').classList.add('open');$('submitForm').onclick=()=>{let v={};for(let [id,label,req] of f[1]){v[id]=$('f-'+id).value.trim();if(req&&!v[id]){$('f-'+id).focus();return}}f[2](v);persist();$('modal').classList.remove('open');render();notify('Dades desades')}}
function initMap(){if(!window.L){$('map').innerHTML=empty('Mapa no disponible','Cal connexió a internet per carregar els mapes.');return}map=L.map('map').setView([41.6,1.7],8);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);markers=L.layerGroup().addTo(map);points=[];addPointInput();map.on('click',e=>{points.push({lat:e.latlng.lat,lon:e.latlng.lng,label:e.latlng.lat.toFixed(4)+', '+e.latlng.lng.toFixed(4)});syncPoints()});setTimeout(()=>map.invalidateSize(),180)}
function addPointInput(){let id=points.length,el=document.createElement('div');el.className='point';el.innerHTML='<input placeholder="Població o adreça"><button type="button">×</button>';el.querySelector('button').onclick=()=>{points.splice(id,1);syncPoints()};el.querySelector('input').onchange=async e=>{let q=e.target.value.trim();if(!q)return;try{let r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q)),j=await r.json();if(!j.length){notify('No he trobat aquesta ubicació');return}points[id]={lat:+j[0].lat,lon:+j[0].lon,label:q};drawPoints()}catch(err){notify('No s’ha pogut cercar la ubicació')}};$('points').append(el)}
function syncPoints(){if(!$('points'))return;let old=points.slice();points=[];$('points').innerHTML='';old.forEach(p=>{points.push(p);addPointInput();$('points').lastElementChild.querySelector('input').value=p.label||''});if(!points.length)addPointInput();drawPoints()}
function drawPoints(){if(!markers)return;markers.clearLayers();points.forEach((p,i)=>L.marker([p.lat,p.lon],{draggable:true}).addTo(markers).bindPopup((i+1)+'. '+esc(p.label)).on('dragend',e=>{let ll=e.target.getLatLng();points[i].lat=ll.lat;points[i].lon=ll.lng;calculated=null}));if(points.length>1)map.fitBounds(points.map(p=>[p.lat,p.lon]),{padding:[25,25]})}
async function calc(){if(points.length<2){notify('Afegeix dos punts com a mínim');return}try{let coords=points.map(p=>p.lon+','+p.lat).join(';'),r=await fetch('https://router.project-osrm.org/route/v1/driving/'+coords+'?overview=full&geometries=geojson'),j=await r.json();if(!j.routes?.length)throw Error();calculated=j.routes[0];L.geoJSON(calculated.geometry,{style:{color:'#c9e66b',weight:5}}).addTo(markers);map.fitBounds(L.geoJSON(calculated.geometry).getBounds(),{padding:[25,25]});notify('Ruta calculada · '+fmt(calculated.distance/1000)+' km')}catch(e){notify('No s’ha pogut calcular. Revisa els punts i la connexió.')}}
function saveRoute(){let name=$('routeName').value.trim();if(!name){notify('Posa un nom a la ruta');return}if(points.length<2){notify('Afegeix com a mínim dos punts');return}db.routes.unshift({name,km:calculated?calculated.distance/1000:0,detail:points.map(p=>p.label).join(' → '),points,geometry:calculated?.geometry||null,date:new Date().toISOString().slice(0,10)});persist();notify('Ruta desada');render()}
function exportGpx(){if(!points.length){notify('No hi ha punts per exportar');return}let coords=calculated?.geometry?.coordinates||points.map(p=>[p.lon,p.lat]),trk=coords.map(p=>'<trkpt lat="'+p[1]+'" lon="'+p[0]+'"/>').join(''),wpt=points.map(p=>'<wpt lat="'+p.lat+'" lon="'+p.lon+'"><name>'+esc(p.label)+'</name></wpt>').join(''),xml='<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="Cathal Road" xmlns="http://www.topografix.com/GPX/1/1">'+wpt+'<trk><name>'+esc($('routeName').value||'Cathal Road')+'</name><trkseg>'+trk+'</trkseg></trk></gpx>';download(xml,'cathal-road.gpx','application/gpx+xml')}
function download(s,n,t){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([s],{type:t}));a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1200)}
function importGpx(file){let r=new FileReader();r.onload=()=>{try{let d=new DOMParser().parseFromString(r.result,'application/xml'),ns=[...d.querySelectorAll('wpt,trkpt,rtept')];if(!ns.length)throw Error();points=ns.map(x=>({lat:+x.getAttribute('lat'),lon:+x.getAttribute('lon'),label:x.querySelector('name')?.textContent||'Punt'})).filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lon));syncPoints();if(points.length>1)calc();notify('GPX importat')}catch(e){notify('El fitxer GPX no és vàlid')}};r.readAsText(file)}
function backup(){download(JSON.stringify(db,null,2),'cathal-road-copia.json','application/json')}
function restore(file){let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d||typeof d!=='object')throw Error();db={...fresh(),...d};persist();render();notify('Còpia recuperada')}catch(e){notify('La còpia no és vàlida')}};r.readAsText(file)}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){section=p.dataset.page;render();return}let f=e.target.closest('[data-form]');if(f){openForm(f.dataset.form);return}if(e.target.closest('[data-close]'))$('modal').classList.remove('open');if(e.target.closest('[data-backup]'))backup();if(e.target.id==='addPoint')addPointInput();if(e.target.id==='calculate')calc();if(e.target.id==='saveRoute')saveRoute();if(e.target.id==='exportGpx')exportGpx()});
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('open')});
$('app').addEventListener('change',e=>{if(e.target.id==='importGpx'&&e.target.files[0])importGpx(e.target.files[0])});
$('date').textContent=' · '+new Intl.DateTimeFormat('ca-ES',{day:'numeric',month:'short'}).format(new Date());
window.addEventListener('error',e=>{console.error(e.error);$('app').innerHTML=empty('Error d’inici',''+esc(e.message),'<button class="btn" onclick="location.reload()">Torna-ho a provar</button>')});
window.addEventListener('unhandledrejection',e=>console.error('Cathal Road',e.reason));
try{render()}catch(e){console.error(e);$('app').innerHTML=empty('No s’ha pogut iniciar',''+esc(e.message))}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
