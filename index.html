<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f2ec"><meta name="description" content="Cathal Road — el teu espai personal per viatjar en moto.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/cathal-road-icon.svg" type="image/svg+xml">
<title>Cathal Road — Motorcycle Journal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--paper:#f4f2ec;--white:#fffefa;--ink:#202923;--muted:#788078;--line:#e6e4dc;--forest:#274b3d;--forest2:#365e4e;--sage:#dce6dc;--sand:#e9e3d5;--gold:#b28a51;--red:#a65f51;--shadow:0 12px 35px #29382c0a;--r:20px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}
.shell{min-height:100vh;display:grid;grid-template-columns:252px 1fr}.sidebar{background:#eeece4;border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px;padding:0 10px 34px}.brand img{width:43px;height:43px;border-radius:13px}.brand strong{font:800 16px Manrope;letter-spacing:1.6px;display:block}.brand small{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}.nav-label{font-size:10px;letter-spacing:1.7px;text-transform:uppercase;color:#9a9e94;font-weight:700;padding:0 12px;margin:18px 0 9px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#667168;text-align:left;padding:12px 13px;border-radius:12px;display:flex;align-items:center;gap:13px;font-weight:600;font-size:13px}.nav button .ico{width:20px;text-align:center;font-size:17px}.nav button.active{background:var(--forest);color:white;box-shadow:0 5px 14px #274b3d20}.side-bottom{margin-top:auto}.garage-mini{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 3px}.garage-mini small{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px}.garage-mini strong{display:block;margin:6px 0 3px;font:700 14px Manrope}.garage-mini span{font-size:11px;color:var(--muted)}
main{min-width:0}.topbar{height:78px;padding:0 clamp(20px,4vw,58px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#f4f2ecdd;backdrop-filter:blur(14px);position:sticky;top:0;z-index:5}.crumb{color:var(--muted);font-size:12px}.crumb b{color:var(--ink);font-weight:600}.top-actions{display:flex;align-items:center;gap:12px}.today{font-size:12px;color:var(--muted)}.avatar{width:36px;height:36px;border-radius:50%;background:var(--sage);color:var(--forest);display:grid;place-items:center;font-weight:800}
.content{max-width:1400px;margin:auto;padding:34px clamp(20px,4vw,58px) 70px}.welcome{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:26px}.kicker{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--forest2);font-weight:800}.welcome h1{font:700 clamp(28px,3vw,39px)/1.15 Manrope;margin:9px 0 8px;letter-spacing:-1.3px}.welcome p{margin:0;color:var(--muted);font-size:14px}.btn{border:0;background:var(--forest);color:#fff;border-radius:11px;padding:12px 17px;font-weight:700;font-size:12px;letter-spacing:.1px;box-shadow:0 5px 13px #274b3d1b}.btn:hover{background:var(--forest2)}.btn.light{background:var(--white);color:var(--forest);border:1px solid var(--line);box-shadow:none}.btn.text{background:transparent;color:var(--forest);box-shadow:none;padding:8px}
.hero{background:var(--forest);color:#fff;border-radius:24px;overflow:hidden;position:relative;min-height:225px;padding:32px 35px;display:flex;align-items:center;margin-bottom:22px}.hero:after{content:"";position:absolute;width:430px;height:430px;border:1px solid #ffffff20;border-radius:50%;right:5%;top:-155px;box-shadow:0 0 0 42px #ffffff08,0 0 0 84px #ffffff06}.hero-copy{max-width:530px;position:relative;z-index:1}.hero .kicker{color:#c8d7c7}.hero h2{font:700 clamp(24px,3vw,34px)/1.2 Manrope;margin:10px 0}.hero p{color:#d2ded4;line-height:1.6;margin:0 0 18px;max-width:440px}.hero .btn{background:#f3f0e7;color:var(--forest);box-shadow:none}.hero-art{position:absolute;right:6%;bottom:-35px;font-size:180px;opacity:.16;transform:rotate(-12deg)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:0 0 30px}.metric{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:17px 18px;box-shadow:var(--shadow)}.metric-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px}.metric-icon{width:29px;height:29px;border-radius:9px;background:var(--sage);display:grid;place-items:center;color:var(--forest);font-size:15px}.metric strong{font:700 25px Manrope;display:block;margin-top:12px;letter-spacing:-.7px}.metric small{font-size:10px;color:var(--muted)}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:28px 0 13px}.section-title h2{font:700 17px Manrope;margin:0;letter-spacing:-.3px}.section-title span{font-size:11px;color:var(--muted)}
.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(270px,1fr);gap:16px}.panel{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:var(--shadow);min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.panel-head b{font:700 13px Manrope}.panel-head span{font-size:11px;color:var(--muted)}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.quick{border:1px solid var(--line);background:var(--white);border-radius:16px;padding:17px;text-align:left;transition:.18s}.quick:hover{border-color:#aebdaf;transform:translateY(-2px);box-shadow:var(--shadow)}.quick .qico{font-size:22px;margin-bottom:12px}.quick b{display:block;font:700 12px Manrope}.quick small{display:block;color:var(--muted);font-size:10px;margin-top:5px;line-height:1.4}
.activity{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #efeee8}.activity:last-child{border:0}.activity-icon{width:36px;height:36px;background:var(--sage);border-radius:11px;display:grid;place-items:center;font-size:16px;flex:none}.activity b{font-size:12px;display:block}.activity small{font-size:10px;color:var(--muted)}
.page-head{margin-bottom:24px}.page-head h1{font:700 32px Manrope;letter-spacing:-1px;margin:7px 0}.page-head p{color:var(--muted);margin:0}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0}.search{background:var(--white);border:1px solid var(--line);border-radius:11px;padding:10px 13px;min-width:180px;color:var(--ink);outline:none}.list{display:grid;gap:10px}.record{display:flex;align-items:center;gap:14px;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:15px 17px}.record-icon{width:42px;height:42px;border-radius:13px;background:var(--sage);display:grid;place-items:center;font-size:19px;flex:none}.record-main{flex:1;min-width:0}.record-main b{font:700 13px Manrope;display:block}.record-main small{color:var(--muted);font-size:11px;display:block;margin-top:4px}.tag{background:#edf1e9;color:var(--forest);border-radius:30px;padding:6px 10px;font-size:10px;font-weight:700;white-space:nowrap}.empty{padding:40px 20px;text-align:center;background:var(--white);border:1px dashed #d4d8ce;border-radius:18px;color:var(--muted)}.empty .eico{font-size:30px;margin-bottom:10px}.empty b{display:block;color:var(--ink);font:700 14px Manrope;margin-bottom:5px}.empty p{font-size:12px;margin:0 0 15px}
.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.detail{background:var(--white);border:1px solid var(--line);border-radius:17px;padding:18px}.detail label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.detail strong{display:block;font:700 17px Manrope;margin-top:7px}
.modal{position:fixed;inset:0;background:#17231dc2;z-index:20;display:none;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.dialog{background:var(--white);border-radius:22px;width:min(100%,520px);max-height:90vh;overflow:auto;padding:25px;box-shadow:0 25px 80px #0003}.dialog h2{font:700 21px Manrope;margin:0 0 18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field.full{grid-column:1/-1}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;background:#faf9f5;border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--ink);outline:none}.field textarea{min-height:75px;resize:vertical}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
.mobile-nav{display:none}
@media(max-width:1000px){.shell{grid-template-columns:215px 1fr}.metrics{grid-template-columns:repeat(2,1fr)}.dashboard-grid{grid-template-columns:1fr}.hero-art{right:1%}}
@media(max-width:720px){.shell{display:block}.sidebar{display:none}.topbar{height:60px;padding:0 18px}.today{display:none}.content{padding:24px 16px 100px}.welcome{align-items:flex-start;flex-direction:column}.welcome .btn{width:100%}.hero{padding:25px 23px;min-height:215px}.hero-art{font-size:130px;right:-10px;bottom:-24px}.metrics{gap:9px}.metric{padding:13px}.metric strong{font-size:22px}.quick-grid{grid-template-columns:repeat(2,1fr)}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:10;background:#fffefaed;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 5px calc(8px + env(safe-area-inset-bottom));justify-content:space-around}.mobile-nav button{border:0;background:none;color:#879087;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;min-width:52px}.mobile-nav button span{font-size:18px}.mobile-nav button.active{color:var(--forest);font-weight:800}.page-head h1{font-size:28px}.record{padding:12px}.tag{display:none}}
@media(max-width:390px){.metrics{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.quick-grid{gap:8px}.quick{padding:13px}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar">
 <div class="brand"><img src="assets/cathal-road-icon.svg" alt=""><div><strong>CATHAL ROAD</strong><small>Motorcycle journal</small></div></div>
 <div class="nav-label">Espai personal</div>
 <nav class="nav" id="sideNav">
  <button data-tab="home" class="active"><span class="ico">⌂</span> Visió general</button>
  <button data-tab="bike"><span class="ico">🏍</span> El meu garatge</button>
  <button data-tab="routes"><span class="ico">↗</span> Rutes</button>
  <button data-tab="trips"><span class="ico">⌖</span> Viatges</button>
 </nav>
 <div class="nav-label">Organització</div>
 <nav class="nav">
  <button data-tab="gear"><span class="ico">◇</span> Equipament</button>
  <button data-tab="expenses"><span class="ico">€</span> Despeses</button>
  <button data-tab="history"><span class="ico">◷</span> Historial</button>
 </nav>
 <div class="side-bottom"><div class="garage-mini"><small>El teu espai de carretera</small><strong id="miniBike">La teva moto</strong><span id="miniBikeSub">Tot a punt per sortir</span></div><div style="padding:10px;color:#9a9e94;font-size:10px">CATHAL ROAD · PERSONAL EDITION</div></div>
</aside>
<main>
 <header class="topbar"><div class="crumb">Cathal Road <span style="padding:0 7px;color:#b4b8af">/</span><b id="crumb">Visió general</b></div><div class="top-actions"><span class="today" id="today"></span><div class="avatar">CR</div></div></header>
 <div class="content" id="view"></div>
</main>
</div>
<nav class="mobile-nav" id="mobileNav">
 <button data-tab="home" class="active"><span>⌂</span>Inici</button><button data-tab="bike"><span>🏍</span>Garatge</button><button data-tab="routes"><span>↗</span>Rutes</button><button data-tab="trips"><span>⌖</span>Viatges</button><button data-tab="more"><span>•••</span>Més</button>
</nav>
<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>
<script>
const KEY='cathal-road-v1';
let data;try{data=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){data={}}
data={bike:{},routes:[],trips:[],maintenance:[],gear:[],expenses:[],rides:[],...data};
let tab='home';
const $=id=>document.getElementById(id);
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('ca-ES');
const euro=n=>Number(n||0).toLocaleString('ca-ES',{style:'currency',currency:'EUR'});
const names={home:'Visió general',bike:'El meu garatge',routes:'Rutes',trips:'Viatges',gear:'Equipament',expenses:'Despeses',history:'Historial',more:'Més eines'};
$('today').textContent=new Intl.DateTimeFormat('ca-ES',{weekday:'long',day:'numeric',month:'long'}).format(new Date());
function empty(icon,title,desc,action,label){return '<div class="empty"><div class="eico">'+icon+'</div><b>'+title+'</b><p>'+desc+'</p>'+(action?'<button class="btn" onclick="'+action+'">'+label+'</button>':'')+'</div>'}
function record(icon,title,desc,tag){return '<div class="record"><div class="record-icon">'+icon+'</div><div class="record-main"><b>'+esc(title)+'</b><small>'+esc(desc||'Sense detalls')+'</small></div>'+(tag?'<span class="tag">'+esc(tag)+'</span>':'')+'</div>'}
function metric(icon,label,value,note){return '<div class="metric"><div class="metric-top"><span>'+label+'</span><span class="metric-icon">'+icon+'</span></div><strong>'+value+'</strong><small>'+note+'</small></div>'}
function section(title,sub,action){return '<div class="section-title"><h2>'+title+'</h2><span>'+sub+'</span></div>'}
function home(){let km=data.rides.reduce((s,x)=>s+Number(x.km||0),0),b=data.bike;return '<div class="welcome"><div><div class="kicker">EL TEU DIARI DE CARRETERA</div><h1>Bon dia. On anem avui?</h1><p>Tot el que necessites per tenir la moto a punt i preparar la pròxima aventura.</p></div><button class="btn" onclick="addRide()">＋ Registrar sortida</button></div><div class="hero"><div class="hero-copy"><div class="kicker">MÉS CARRETERA, MENYS COMPLICACIONS</div><h2>Les millors històries<br>comencen amb una ruta.</h2><p>Planifica escapades, cuida la teva moto i guarda cada quilòmetre del camí.</p><button class="btn" onclick="go(\'routes\')">Explorar les meves rutes　↗</button></div><div class="hero-art">🏍</div></div><div class="metrics">'+metric('⌁','Quilòmetres registrats',fmt(km),'En totes les sortides')+metric('↗','Rutes guardades',data.routes.length,'Idees per descobrir')+metric('⌖','Viatges planificats',data.trips.length,'Escapades i aventures')+metric('🔧','Manteniments',data.maintenance.length,'Intervencions anotades')+'</div>'+section('Accés directe','LES TEVES EINES')+'<div class="quick-grid"><button class="quick" onclick="go(\'bike\')"><div class="qico">🏍</div><b>El meu garatge</b><small>Fitxa tècnica i manteniment</small></button><button class="quick" onclick="go(\'routes\')"><div class="qico">↗</div><b>Planificar una ruta</b><small>Desa nous recorreguts</small></button><button class="quick" onclick="go(\'trips\')"><div class="qico">⌖</div><b>Organitzar un viatge</b><small>Prepara cada etapa</small></button><button class="quick" onclick="go(\'gear\')"><div class="qico">◇</div><b>El meu equipament</b><small>Material i accessoris</small></button><button class="quick" onclick="go(\'expenses\')"><div class="qico">€</div><b>Control de despeses</b><small>Combustible i manteniment</small></button><button class="quick" onclick="go(\'history\')"><div class="qico">◷</div><b>El meu historial</b><small>Sortides i quilòmetres</small></button></div><div class="dashboard-grid"><div>'+section('Activitat recent','ÚLTIMS REGISTRES')+'<div class="panel">'+(data.rides.length?data.rides.slice(0,4).map(x=>'<div class="activity"><div class="activity-icon">🏁</div><div style="flex:1"><b>'+esc(x.name)+'</b><small>'+esc(x.date||'Data no indicada')+'</small></div><span class="tag">'+fmt(x.km)+' km</span></div>').join(''):empty('🏁','Encara no hi ha sortides','Quan registris la primera sortida, la trobaràs aquí.','addRide()','Registrar sortida'))+'</div></div><div>'+section('La teva moto','GARATGE')+'<div class="panel">'+(b.name?'<div class="activity"><div class="activity-icon">🏍</div><div style="flex:1"><b>'+esc(b.name)+'</b><small>'+esc([b.brand,b.model,b.year].filter(Boolean).join(' · '))+'</small></div></div><div class="detail-grid"><div class="detail"><label>Quilometratge</label><strong>'+esc(b.km||'—')+' km</strong></div><div class="detail"><label>Matrícula</label><strong>'+esc(b.plate||'—')+'</strong></div></div><button class="btn light" style="margin-top:14px" onclick="go(\'bike\')">Veure garatge →</button>':empty('🏍','Encara no tens moto','Afegeix les dades de la teva moto per començar.','editBike()','Crear fitxa'))+'</div></div></div><p style="font-size:10px;color:#9a9e94;margin-top:26px">Les teves dades es desen localment en aquest dispositiu.</p>'}
function pageHead(kicker,title,desc,button){return '<div class="page-head"><div class="kicker">'+kicker+'</div><h1>'+title+'</h1><p>'+desc+'</p></div>'}
function listPage(title,kicker,desc,items,icon,emptyTitle,emptyDesc,action,btn){return pageHead(kicker,title,desc)+'<div class="toolbar"><span style="font-size:11px;color:var(--muted)">'+items.length+' registres</span><button class="btn" onclick="'+action+'">＋ '+btn+'</button></div><div class="list">'+(items.length?items.map(x=>record(icon,x.name||x.title||x.type||'Registre',[x.detail,x.date,x.start&&x.end?x.start+' – '+x.end:''].filter(Boolean).join(' · '),x.km?fmt(x.km)+' km':x.cost?euro(x.cost):x.status||'Guardat')).join(''):empty(icon,emptyTitle,emptyDesc,action,btn))+'</div>'}
function bike(){let b=data.bike;return pageHead('EL TEU GARATGE','La meva moto','La fitxa personal i tot el manteniment, en un mateix lloc.')+'<div class="toolbar"><span class="tag">FITXA DEL VEHICLE</span><button class="btn" onclick="editBike()">Editar fitxa</button></div>'+(b.name?'<div class="panel" style="margin-bottom:16px"><div style="display:flex;gap:16px;align-items:center"><div class="record-icon" style="width:58px;height:58px;font-size:27px">🏍</div><div><div class="kicker">'+esc(b.brand||'LA TEVA MOTO')+'</div><h2 style="font:700 22px Manrope;margin:4px 0">'+esc(b.name)+'</h2><span style="color:var(--muted);font-size:12px">'+esc([b.model,b.year].filter(Boolean).join(' · '))+'</span></div></div><div class="detail-grid" style="margin-top:22px">'+[['Matrícula',b.plate],['Quilometratge',b.km?fmt(b.km)+' km':'—'],['ITV',b.itv||'No indicada'],['Assegurança',b.insurance||'No indicada']].map(x=>'<div class="detail"><label>'+x[0]+'</label><strong>'+esc(x[1]||'—')+'</strong></div>').join('')+'</div></div>':empty('🏍','Comencem pel teu garatge','Afegeix les dades bàsiques de la moto.','editBike()','Afegir la meva moto'))+section('Manteniment i revisions',data.maintenance.length+' intervencions')+'<div class="toolbar"><span></span><button class="btn light" onclick="addMaintenance()">＋ Anotar manteniment</button></div><div class="list">'+(data.maintenance.length?data.maintenance.map(x=>record('🔧',x.name,[x.date,x.km?fmt(x.km)+' km':'',x.detail].filter(Boolean).join(' · '),x.cost?euro(x.cost):'')).join(''):empty('🔧','Cap manteniment registrat','Anota canvis d’oli, pneumàtics, frens i revisions.','addMaintenance()','Afegir manteniment'))+'</div>'+section('Sortides registrades',data.rides.length+' sortides')+'<div class="toolbar"><span></span><button class="btn light" onclick="addRide()">＋ Registrar sortida</button></div><div class="list">'+(data.rides.length?data.rides.map(x=>record('🏁',x.name,(x.date||'')+' · '+(x.detail||''),fmt(x.km)+' km')).join(''):empty('🏁','Encara no hi ha sortides','Registra els quilòmetres de cada escapada.','addRide()','Registrar sortida'))+'</div>'}
function routes(){return listPage('Les meves rutes','CARRETERES I CAMINS','Desa idees, destinacions i recorreguts per a les pròximes sortides.',data.routes,'↗','El mapa encara és en blanc','Afegeix la primera ruta que vols fer.', 'addRoute()','Nova ruta')+'<p class="notice" style="color:var(--muted);font-size:11px;margin-top:20px">La planificació cartogràfica, els fitxers GPX i la navegació seran una fase posterior.</p>'}
function trips(){return listPage('Els meus viatges','ESCAPADES I AVENTURES','Organitza els teus viatges i guarda tota la informació important.',data.trips,'⌖','Encara no hi ha cap viatge','Planifica una escapada, una ruta de diversos dies o un gran viatge.','addTrip()','Planificar viatge')}
function gear(){return listPage('El meu equipament','MATERIAL I ACCESSORIS','Controla el material que tens preparat per sortir de ruta.',data.gear,'◇','La bossa encara és buida','Afegeix casc, jaqueta, guants, eines o material d’acampada.','addGear()','Afegir equipament')}
function expenses(){let total=data.expenses.reduce((s,x)=>s+Number(x.cost||0),0);return pageHead('CONTROL I PRESSUPOST','Les meves despeses','Un registre senzill dels costos associats a la moto i als viatges.')+'<div class="metrics" style="grid-template-columns:repeat(2,1fr)">'+metric('€','Total registrat',euro(total),'Suma de les despeses')+metric('▤','Moviments',data.expenses.length,'Despeses anotades')+'</div><div class="toolbar"><span></span><button class="btn" onclick="addExpense()">＋ Afegir despesa</button></div><div class="list">'+(data.expenses.length?data.expenses.map(x=>record('€',x.name,[x.date,x.detail].filter(Boolean).join(' · '),euro(x.cost))).join(''):empty('€','Encara no hi ha despeses','Anota combustible, peatges, allotjaments i manteniment.','addExpense()','Afegir despesa'))+'</div>'}
function history(){let km=data.rides.reduce((s,x)=>s+Number(x.km||0),0);return pageHead('EL TEU CAMÍ','Historial de carretera','Totes les sortides que has anat registrant.')+'<div class="metrics" style="grid-template-columns:repeat(2,1fr)">'+metric('⌁','Quilòmetres totals',fmt(km),'Distància acumulada')+metric('🏁','Sortides',data.rides.length,'Registres guardats')+'</div><div class="toolbar"><span></span><button class="btn" onclick="addRide()">＋ Registrar sortida</button></div><div class="list">'+(data.rides.length?data.rides.map(x=>record('🏁',x.name,[x.date,x.detail].filter(Boolean).join(' · '),fmt(x.km)+' km')).join(''):empty('🏁','La teva història comença aquí','Registra la primera sortida per començar a crear el teu historial.','addRide()','Registrar sortida'))+'</div>'}
function more(){return pageHead('ORGANITZACIÓ','Més eines','Accedeix a les altres àrees del teu espai personal.')+'<div class="quick-grid"><button class="quick" onclick="go(\'gear\')"><div class="qico">◇</div><b>Equipament</b><small>Material i accessoris</small></button><button class="quick" onclick="go(\'expenses\')"><div class="qico">€</div><b>Despeses</b><small>Control de costos</small></button><button class="quick" onclick="go(\'history\')"><div class="qico">◷</div><b>Historial</b><small>Sortides i quilòmetres</small></button></div><div class="panel" style="margin-top:20px"><b style="font:700 14px Manrope">Les teves dades</b><p style="color:var(--muted);font-size:12px;line-height:1.6">La informació de Cathal Road es desa al navegador d'aquest dispositiu. En aquesta versió no hi ha sincronització al núvol.</p><button class="btn light" onclick="exportData()">Exportar còpia de seguretat</button><button class="btn light" style="margin-left:7px" onclick="importData()">Importar còpia</button></div>'}
function go(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$('crumb').textContent=names[t]||'Més eines';render()}
function render(){let fn={home,bike,routes,trips,gear,expenses,history,more};$('view').innerHTML=(fn[tab]||home)();$('miniBike').textContent=data.bike.name||'La teva moto';$('miniBikeSub').textContent=data.bike.model||'Tot a punt per sortir'}
function openForm(title,fields,onSave){$('dialog').innerHTML='<h2>'+title+'</h2><div class="fields">'+fields.map(f=>'<div class="field '+(f.full?'full':'')+'"><label>'+f.label+'</label><input id="f-'+f.id+'" type="'+(f.type||'text')+'" placeholder="'+(f.placeholder||'')+'" '+(f.required?'required':'')+'></div>').join('')+'</div><div class="dialog-actions"><button class="btn light" id="cancel">Cancel·lar</button><button class="btn" id="save">Desar registre</button></div>';$('modal').classList.add('show');$('cancel').onclick=()=>$('modal').classList.remove('show');$('save').onclick=()=>{let v={};for(let f of fields){let el=$('f-'+f.id);v[f.id]=el.value.trim();if(f.required&&!v[f.id]){el.focus();return}}onSave(v);save();$('modal').classList.remove('show');render()}}
function editBike(){let b=data.bike;openForm('Fitxa de la meva moto',[{id:'name',label:'Nom de la moto',required:true},{id:'brand',label:'Marca'},{id:'model',label:'Model'},{id:'year',label:'Any',type:'number'},{id:'plate',label:'Matrícula'},{id:'km',label:'Quilometratge actual (km)',type:'number'},{id:'itv',label:'Venciment ITV',type:'date'},{id:'insurance',label:'Venciment assegurança',type:'date'}],v=>data.bike={...b,...v});for(let f of ['name','brand','model','year','plate','km','itv','insurance'])setTimeout(()=>{if($('f-'+f))$('f-'+f).value=b[f]||''},0)}
function addMaintenance(){openForm('Anotar manteniment',[{id:'name',label:'Intervenció',required:true},{id:'date',label:'Data',type:'date'},{id:'km',label:'Quilometratge (km)',type:'number'},{id:'cost',label:'Cost (€)',type:'number'},{id:'detail',label:'Notes',full:true}],v=>data.maintenance.unshift(v))}
function addRide(){openForm('Registrar sortida',[{id:'name',label:'Nom de la sortida',required:true},{id:'date',label:'Data',type:'date'},{id:'km',label:'Quilòmetres recorreguts',type:'number',required:true},{id:'detail',label:'Notes',full:true}],v=>data.rides.unshift(v))}
function addRoute(){openForm('Crear una ruta',[{id:'name',label:'Nom de la ruta',required:true},{id:'start',label:'Punt de sortida'},{id:'end',label:'Destinació'},{id:'km',label:'Distància aproximada (km)',type:'number'},{id:'duration',label:'Durada estimada'},{id:'detail',label:'Notes i punts d’interès',full:true}],v=>data.routes.unshift(v))}
function addTrip(){openForm('Planificar un viatge',[{id:'name',label:'Nom del viatge',required:true},{id:'start',label:'Data de sortida',type:'date'},{id:'end',label:'Data de tornada',type:'date'},{id:'destination',label:'Destinació'},{id:'detail',label:'Etapes, allotjaments i notes',full:true}],v=>data.trips.unshift(v))}
function addGear(){openForm('Afegir equipament',[{id:'name',label:'Material o accessori',required:true},{id:'type',label:'Categoria'},{id:'detail',label:'Notes',full:true}],v=>data.gear.unshift(v))}
function addExpense(){openForm('Afegir despesa',[{id:'name',label:'Concepte',required:true},{id:'date',label:'Data',type:'date'},{id:'cost',label:'Import (€)',type:'number',required:true},{id:'detail',label:'Notes',full:true}],v=>data.expenses.unshift(v))}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cathal-road-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(){let i=document.createElement('input');i.type='file';i.accept='application/json';i.onchange=()=>{let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data={...data,...JSON.parse(r.result)};save();render();alert('Còpia importada correctament')}catch(e){alert('El fitxer no és vàlid')}};r.readAsText(f)};i.click()}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')$('modal').classList.remove('show')});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script>
</body></html>
